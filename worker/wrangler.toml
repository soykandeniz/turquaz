name = "turquaz-content"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
SITE_URL = "https://www.turquazsf.com"
SITE_NAME = "Turquaz"
ADMIN_USER = "admin"
NOTIFICATION_EMAIL = "sf@oklavacafe.com"
EMAIL_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxU-2bA8IPsLpl9QyFCP6jaKgjEcOnsjq1lm-G5G202x5sBo1pEWsUqE7gsOe-YXVE/exec"
GA_MEASUREMENT_ID = "G-BTGPBFN65C"

[[d1_databases]]
binding = "DB"
database_name = "turquaz-content"
database_id = "32ec2e47-f580-4deb-a1db-3bf72e44513a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "turquaz-media"

